<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sastrería - Sistema Cámara en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-dark { background-color: #080808; }
        .bg-card { background-color: #121212; }
        /* Ocultar barra de scroll en carrusel pero permitir deslizar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-dark text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center p-4 md:p-6">

    <div class="bg-card p-8 md:p-10 rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] border border-zinc-800 w-full max-w-xl transition-all duration-300">
        
        <!-- SECCIÓN LOGIN -->
        <div id="sec-login" class="flex flex-col space-y-5">
            <h1 class="text-3xl md:text-4xl font-extrabold text-center mb-2 text-amber-500 tracking-wider">SASTRERÍA</h1>
            <p class="text-gray-400 text-center mb-4">Inicia sesión para continuar</p>
            
            <form onsubmit="iniciarSesion(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-300 uppercase mb-2">Usuario</label>
                    <input type="text" id="login-user" required class="w-full p-4 text-lg bg-zinc-900 border border-zinc-700 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-300 uppercase mb-2">Contraseña</label>
                    <input type="password" id="login-pass" required class="w-full p-4 text-lg bg-zinc-900 border border-zinc-700 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                </div>
                <p id="login-error" class="text-red-500 text-sm hidden text-center">Usuario o contraseña incorrectos.</p>
                <button type="submit" class="w-full py-4 mt-2 text-lg bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-md transition-all">
                    Ingresar
                </button>
            </form>
        </div>

        <!-- MENÚ PRINCIPAL -->
        <div id="menu-principal" class="hidden flex flex-col space-y-5">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl md:text-3xl font-extrabold text-amber-500 tracking-wider">MENÚ PRINCIPAL</h1>
                <button onclick="cerrarSesion()" class="text-sm text-gray-400 hover:text-red-400">🚪 Salir</button>
            </div>
            
            <button onclick="mostrarPendientes()" class="w-full py-5 text-lg bg-green-600 hover:bg-green-500 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-1">
                🟢 Mostrar Solo Pendientes
            </button>
            <button onclick="mostrarTodos()" class="w-full py-4 text-lg bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-1">
                📋 Mostrar Todos los Registros
            </button>
            <button onclick="cambiarSeccion('sec-buscar')" class="w-full py-4 text-lg bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-1">
                🔍 Buscar Cliente Específico
            </button>

            <div class="grid grid-cols-2 gap-3 mt-2">
                <button onclick="cambiarSeccion('sec-hombre')" class="w-full py-4 text-sm bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-2xl border border-zinc-700 shadow-lg transition-all">
                    👨 Reg. Hombre
                </button>
                <button onclick="cambiarSeccion('sec-mujer')" class="w-full py-4 text-sm bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-2xl border border-zinc-700 shadow-lg transition-all">
                    👩 Reg. Mujer
                </button>
            </div>
            
            <hr class="border-zinc-800 my-2">
            
            <button onclick="cambiarSeccion('sec-admin')" class="w-full py-4 text-base bg-zinc-900 hover:bg-zinc-800 text-amber-500 font-bold rounded-2xl border border-amber-600/30 transition-all">
                ⚙️ Constructor de Bloques (Admin)
            </button>
        </div>

        <!-- SECCIÓN HOMBRE -->
        <div id="sec-hombre" class="hidden flex flex-col space-y-4">
            <h2 class="text-2xl font-bold text-center text-amber-500 mb-2">👨 Prenda de Hombre</h2>
            <button onclick="abrirFormulario('Hombre', 'Pantalón')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👖 Pantalón</button>
            <button onclick="abrirFormulario('Hombre', 'Saco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">🧥 Saco</button>
            <button onclick="abrirFormulario('Hombre', 'Chaleco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">🦺 Chaleco</button>
            <button onclick="abrirFormulario('Hombre', 'Pantalón y Saco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👖🧥 Pantalón y Saco</button>
            <button onclick="abrirFormulario('Hombre', 'Pantalón y Chaleco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👖🦺 Pantalón y Chaleco</button>
            <button onclick="abrirFormulario('Hombre', 'Traje Completo')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">💼 Traje Completo</button>
            <button onclick="regresarMenu()" class="text-base text-gray-400 hover:text-white underline text-center mt-4">← Volver al Menú</button>
        </div>

        <!-- SECCIÓN MUJER -->
        <div id="sec-mujer" class="hidden flex flex-col space-y-4">
            <h2 class="text-2xl font-bold text-center text-amber-500 mb-2">👩 Prenda de Mujer</h2>
            <button onclick="abrirFormulario('Mujer', 'Pantalón')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👖 Pantalón</button>
            <button onclick="abrirFormulario('Mujer', 'Falda')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👗 Falda</button>
            <button onclick="abrirFormulario('Mujer', 'Saco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">🧥 Saco</button>
            <button onclick="abrirFormulario('Mujer', 'Chaleco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">🦺 Chaleco</button>
            <button onclick="abrirFormulario('Mujer', 'Pantalón y Saco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👖🧥 Pantalón y Saco</button>
            <button onclick="abrirFormulario('Mujer', 'Pantalón y Chaleco')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">👖🦺 Pantalón y Chaleco</button>
            <button onclick="abrirFormulario('Mujer', 'Traje Completo')" class="w-full py-4 text-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl font-medium text-left px-6 transition-colors">💼 Traje Completo</button>
            <button onclick="regresarMenu()" class="text-base text-gray-400 hover:text-white underline text-center mt-4">← Volver al Menú</button>
        </div>

        <!-- SECCIÓN ADMIN -->
        <div id="sec-admin" class="hidden flex flex-col space-y-5">
            <h2 class="text-2xl font-bold text-center text-amber-500">⚙️ Crear Bloques</h2>
            
            <div class="space-y-4 bg-zinc-900 p-5 rounded-xl border border-zinc-800 shadow-inner">
                <div>
                    <label class="block text-sm font-bold text-gray-300 uppercase mb-2">Nombre de la Medida / Sección</label>
                    <input type="text" id="nuevo-campo-nombre" placeholder="Ej: Cintura, Celular, Tipo de Tela..." class="w-full p-3 text-base bg-zinc-800 border border-zinc-700 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-300 uppercase mb-2">Tipo de Bloque</label>
                    <select id="nuevo-campo-tipo" onchange="verificarTipoCampo()" class="w-full p-3 text-base bg-zinc-800 border border-zinc-700 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                        <option value="text">Cuadro de Texto Corto</option>
                        <option value="number">Cuadro Numérico</option>
                        <option value="select">Lista Desplegable (Menú)</option>
                        <option value="separator">➖ Línea Separadora (Diseño)</option>
                    </select>
                </div>
                
                <div id="contenedor-opciones" class="hidden">
                    <label class="block text-sm font-bold text-amber-500 uppercase mb-2">Opciones separadas por coma (,)</label>
                    <input type="text" id="nuevo-campo-opciones" placeholder="Ej: Clásico, Entallado, Recto" class="w-full p-3 text-base bg-zinc-950 border border-amber-600/50 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-300 uppercase mb-2">¿A qué formulario pertenece?</label>
                    <select id="nuevo-campo-destino" class="w-full p-3 text-base bg-zinc-800 border border-zinc-700 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                        <option value="Todos">🌐 Global (Aparecerá en todas las prendas)</option>
                        <optgroup label="👨 Hombre">
                            <option value="Hombre-Pantalón">Hombre - Pantalón</option>
                            <option value="Hombre-Saco">Hombre - Saco</option>
                            <option value="Hombre-Chaleco">Hombre - Chaleco</option>
                            <option value="Hombre-Pantalón y Saco">Hombre - Pantalón y Saco</option>
                            <option value="Hombre-Pantalón y Chaleco">Hombre - Pantalón y Chaleco</option>
                            <option value="Hombre-Traje Completo">Hombre - Traje Completo</option>
                        </optgroup>
                        <optgroup label="👩 Mujer">
                            <option value="Mujer-Pantalón">Mujer - Pantalón</option>
                            <option value="Mujer-Falda">Mujer - Falda</option>
                            <option value="Mujer-Saco">Mujer - Saco</option>
                            <option value="Mujer-Chaleco">Mujer - Chaleco</option>
                            <option value="Mujer-Pantalón y Saco">Mujer - Pantalón y Saco</option>
                            <option value="Mujer-Pantalón y Chaleco">Mujer - Pantalón y Chaleco</option>
                            <option value="Mujer-Traje Completo">Mujer - Traje Completo</option>
                        </optgroup>
                    </select>
                </div>

                <button onclick="agregarCampoDinamico()" class="w-full py-3.5 text-base bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition-all shadow-md">
                    + Añadir Bloque
                </button>
            </div>

            <!-- FILTRO DE ADMINISTRADOR -->
            <div class="mt-4 p-3 bg-zinc-900 border border-zinc-800 rounded-xl">
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Filtrar vista del Administrador:</label>
                <select id="filtro-admin" onchange="renderListaCamposAdmin()" class="w-full p-2 text-sm bg-zinc-950 border border-zinc-700 rounded-lg text-amber-500 focus:outline-none">
                    <option value="Todos">Ver todos los bloques mezclados</option>
                    <option value="Hombre-Pantalón">Solo Hombre - Pantalón</option>
                    <option value="Hombre-Saco">Solo Hombre - Saco</option>
                    <option value="Hombre-Chaleco">Solo Hombre - Chaleco</option>
                    <option value="Hombre-Pantalón y Saco">Solo Hombre - Pantalón y Saco</option>
                    <option value="Hombre-Pantalón y Chaleco">Solo Hombre - Pantalón y Chaleco</option>
                    <option value="Mujer-Pantalón">Solo Mujer - Pantalón</option>
                    <option value="Mujer-Saco">Solo Mujer - Saco</option>
                </select>
            </div>

            <h3 class="text-lg font-bold text-gray-200 mt-2 flex justify-between">
                <span>Bloques Creados:</span>
                <span class="text-sm text-gray-500 font-normal">Ordena con ⬆️ ⬇️</span>
            </h3>
            <div id="lista-campos-dinamicos" class="space-y-3 max-h-64 overflow-y-auto pr-2"></div>

            <button onclick="regresarMenu()" class="text-base text-gray-400 hover:text-white underline text-center mt-4">← Volver al Menú</button>
        </div>

        <!-- SECCIÓN BUSCAR -->
        <div id="sec-buscar" class="hidden flex flex-col space-y-5">
            <h2 class="text-2xl font-bold text-center text-amber-500">🔍 Buscar Cliente</h2>
            <input type="text" id="input-buscar" placeholder="Busca por nombre o celular..." class="w-full p-4 text-base md:text-lg bg-zinc-900 border border-zinc-700 rounded-xl focus:border-amber-500 text-white focus:outline-none">
            <button onclick="buscarCliente()" class="w-full py-4 text-lg bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-md">Buscar</button>
            <div id="resultados-busqueda" class="mt-4 p-4 bg-zinc-900 rounded-xl border border-zinc-800 max-h-96 overflow-y-auto space-y-4"></div>
            <button onclick="regresarMenu()" class="text-base text-gray-400 hover:text-white underline text-center mt-4">← Volver</button>
        </div>

        <!-- FORMULARIO DE MEDIDAS -->
        <div id="sec-formulario" class="hidden flex flex-col space-y-5">
            <h2 id="form-titulo" class="text-2xl font-bold text-center text-amber-500">📝 Registro</h2>
            
            <form id="form-medidas" onsubmit="guardarDatos(event)" class="space-y-6">
                <input type="hidden" id="form-genero">
                <input type="hidden" id="form-prenda">

                <div>
                    <label class="block text-sm font-bold text-gray-300 uppercase mb-2">Nombre del Cliente *</label>
                    <input type="text" id="nombre-cliente" required placeholder="Nombre completo" class="w-full p-3.5 text-base bg-zinc-900 border border-zinc-700 rounded-xl text-white focus:border-amber-500 focus:outline-none">
                </div>

                <!-- BLOQUES CREADOS POR EL ADMIN -->
                <div id="campos-dinamicos-inyectados" class="space-y-5 grid grid-cols-1 gap-2 mt-4"></div>

                <!-- SECCIÓN FINANCIERA -->
                <div class="mt-4 p-4 bg-zinc-900 border border-zinc-700 rounded-xl">
                    <h3 class="text-sm font-bold text-amber-500 uppercase mb-3">💰 Detalles de Pago</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] md:text-xs font-bold text-gray-300 uppercase mb-1">A cuenta</label>
                            <input type="number" step="any" id="pago-acuenta" required class="w-full p-2 text-base bg-zinc-950 border border-zinc-700 rounded-lg text-white focus:border-amber-500 focus:outline-none text-center">
                        </div>
                        <div>
                            <label class="block text-[10px] md:text-xs font-bold text-gray-300 uppercase mb-1">Saldo</label>
                            <input type="number" step="any" id="pago-saldo" required class="w-full p-2 text-base bg-zinc-950 border border-zinc-700 rounded-lg text-white focus:border-amber-500 focus:outline-none text-center">
                        </div>
                        <div>
                            <label class="block text-[10px] md:text-xs font-bold text-gray-300 uppercase mb-1">Total</label>
                            <input type="number" step="any" id="pago-total" required class="w-full p-2 text-base bg-zinc-950 border border-zinc-700 rounded-lg text-white focus:border-amber-500 focus:outline-none text-center">
                        </div>
                    </div>
                </div>

                <!-- FECHA Y HORA DE ENTREGA -->
                <div class="mt-4 grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] md:text-sm font-bold text-blue-400 uppercase mb-2">📅 Fecha Entrega *</label>
                        <input type="date" id="fecha-entrega" required class="w-full p-3.5 text-base bg-zinc-900 border border-blue-600/50 rounded-xl text-white focus:border-blue-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] md:text-sm font-bold text-blue-400 uppercase mb-2">⏰ Hora Entrega *</label>
                        <input type="time" id="hora-entrega" required class="w-full p-3.5 text-base bg-zinc-900 border border-blue-600/50 rounded-xl text-white focus:border-blue-400 focus:outline-none">
                    </div>
                </div>

                <!-- BLOQUE DE CÁMARA CARRUSEL -->
                <div class="mt-4 p-5 bg-zinc-900 border border-zinc-800 rounded-xl shadow-inner">
                    <label class="block text-sm font-bold text-amber-500 uppercase mb-3">📸 Fotos de Tela / Referencia</label>
                    
                    <!-- Contenedor Carrusel -->
                    <div id="carrusel-fotos" class="hidden overflow-x-auto no-scrollbar snap-x snap-mandatory gap-3 w-full pb-2 mb-3">
                        <!-- Las fotos se insertan aquí -->
                    </div>

                    <div id="contenedor-camara" class="hidden flex-col items-center w-full space-y-3 mb-3">
                        <video id="video-camara" autoplay playsinline class="w-full max-h-72 object-cover rounded-xl border-2 border-amber-600 shadow-md bg-black"></video>
                        <div class="flex gap-2 w-full">
                            <button type="button" onclick="apagarCamara()" class="w-1/3 py-4 text-base bg-zinc-700 hover:bg-zinc-600 text-white font-bold rounded-xl transition-all">Cancelar</button>
                            <button type="button" onclick="tomarFotoEnVivo()" class="w-2/3 py-4 text-lg bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-[0_0_10px_rgba(217,119,6,0.5)] transition-all">📸 Capturar</button>
                        </div>
                    </div>
                    
                    <button type="button" id="btn-abrir-camara" onclick="iniciarCamara()" class="w-full py-3.5 text-base bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 text-white font-bold rounded-xl transition-all flex items-center justify-center space-x-2">
                        <span>📷</span> <span>Añadir Foto Nueva</span>
                    </button>

                    <input type="hidden" id="foto-base64">
                </div>

                <button type="submit" id="btn-guardar-datos" class="w-full py-4 text-lg bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-[0_0_15px_rgba(217,119,6,0.4)] transition-all">
                    💾 Guardar Datos
                </button>
            </form>
            <button onclick="regresarSubmenu()" class="text-base text-gray-400 hover:text-white underline text-center mt-2">← Atrás</button>
        </div>
    </div>

    <!-- MODAL PANTALLA COMPLETA PARA FOTOS -->
    <div id="modal-imagen" class="hidden fixed inset-0 z-[150] bg-black/95 flex justify-center items-center p-2 cursor-pointer transition-opacity" onclick="cerrarModalImagen()">
        <button class="absolute top-6 right-6 text-white bg-zinc-800/80 hover:bg-red-500 rounded-full w-10 h-10 flex items-center justify-center font-bold text-xl backdrop-blur-md transition-all">&times;</button>
        <img id="img-modal" src="" class="max-w-full max-h-full object-contain rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.8)] transition-transform transform scale-95 duration-300">
    </div>

    <!-- Botón flotante para instalar PWA (Oculto por defecto) -->
    <button id="btn-instalar" class="hidden fixed bottom-6 right-6 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 px-5 rounded-full shadow-[0_4px_20px_rgba(217,119,6,0.5)] z-50 transition-transform transform hover:scale-105 flex items-center space-x-2 border border-amber-500">
        <span class="text-2xl">📱</span>
        <span class="text-base uppercase tracking-wider">Instalar App</span>
    </button>

    <script>
        // === TU URL DE GOOGLE ===
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPNjautx58k_ON3HzoCUUOFXM2rbya5VcdFWZGdDtjFibQtfzXzuXQF_m0nVJYbBuFFg/exec";
        
        let camposPersonalizados = JSON.parse(localStorage.getItem('camposSastreriaFinal')) || [];
        let streamCamaraGlobal = null;
        let resultadosGlobales = []; 
        let filaEditando = null;
        let fotosActuales = []; 

        window.addEventListener('DOMContentLoaded', () => {
            const logueado = localStorage.getItem('sastreria_logueado');
            if (logueado === 'true') {
                cambiarSeccion('menu-principal', false);
                history.replaceState({ seccion: 'menu-principal' }, "", "");
                cargarClientesSilencioso();
            } else {
                history.replaceState({ seccion: 'sec-login' }, "", "");
            }
        });

        function normalizarTexto(txt) {
            return txt ? txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim() : "";
        }

        function cargarClientesSilencioso() {
            fetch(`${WEB_APP_URL}?action=get`)
                .then(res => res.json())
                .then(lista => { resultadosGlobales = lista; })
                .catch(e => console.log("Carga falló", e));
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.seccion) {
                cambiarSeccion(e.state.seccion, false);
            }
        });

        function abrirModalImagen(src) {
            const modal = document.getElementById('modal-imagen');
            const img = document.getElementById('img-modal');
            img.src = src;
            modal.classList.remove('hidden');
            setTimeout(() => { img.classList.replace('scale-95', 'scale-100'); }, 10);
        }

        function cerrarModalImagen() {
            const modal = document.getElementById('modal-imagen');
            const img = document.getElementById('img-modal');
            img.classList.replace('scale-100', 'scale-95');
            setTimeout(() => { modal.classList.add('hidden'); img.src = ""; }, 200);
        }

        function formatearFechaTexto(fechaStr) {
            if (!fechaStr) return '';
            const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
            try {
                if (fechaStr.includes('-')) {
                    const partes = fechaStr.split('T')[0].split('-');
                    return `${parseInt(partes[2], 10)} de ${meses[parseInt(partes[1], 10) - 1]}`;
                } else if (fechaStr.includes('/')) {
                    const partes = fechaStr.split('/');
                    return `${parseInt(partes[0], 10)} de ${meses[parseInt(partes[1], 10) - 1]}`;
                }
                const f = new Date(fechaStr);
                return `${f.getDate()} de ${meses[f.getMonth()]}`;
            } catch (e) {
                return fechaStr;
            }
        }

        function formatearHoraTexto(horaStr) {
            if (!horaStr) return '';
            try {
                const [h, m] = horaStr.split(':');
                let horas = parseInt(h, 10);
                const ampm = horas >= 12 ? 'PM' : 'AM';
                horas = horas % 12;
                horas = horas ? horas : 12; 
                return `${horas}:${m} ${ampm}`;
            } catch(e) {
                return horaStr;
            }
        }

        function moverCampo(index, direccion) {
            if (direccion === -1 && index > 0) {
                let temp = camposPersonalizados[index - 1];
                camposPersonalizados[index - 1] = camposPersonalizados[index];
                camposPersonalizados[index] = temp;
            } else if (direccion === 1 && index < camposPersonalizados.length - 1) {
                let temp = camposPersonalizados[index + 1];
                camposPersonalizados[index + 1] = camposPersonalizados[index];
                camposPersonalizados[index] = temp;
            }
            localStorage.setItem('camposSastreriaFinal', JSON.stringify(camposPersonalizados));
            renderListaCamposAdmin();
        }

        async function iniciarCamara() {
            try {
                const video = document.getElementById('video-camara');
                streamCamaraGlobal = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, audio: false 
                });
                video.srcObject = streamCamaraGlobal;
                
                document.getElementById('btn-abrir-camara').classList.add('hidden');
                document.getElementById('contenedor-camara').classList.remove('hidden');
                document.getElementById('contenedor-camara').classList.add('flex');
            } catch (error) {
                alert("No se pudo acceder a la cámara. Asegúrate de dar permisos.");
            }
        }

        function apagarCamara() {
            if (streamCamaraGlobal) {
                streamCamaraGlobal.getTracks().forEach(track => track.stop());
                streamCamaraGlobal = null;
            }
            document.getElementById('contenedor-camara').classList.remove('flex');
            document.getElementById('contenedor-camara').classList.add('hidden');
            document.getElementById('btn-abrir-camara').classList.remove('hidden');
        }

        function tomarFotoEnVivo() {
            const video = document.getElementById('video-camara');
            const canvas = document.createElement('canvas');
            
            const maxAncho = 400; 
            const proporcion = maxAncho / video.videoWidth;
            canvas.width = maxAncho;
            canvas.height = video.videoHeight * proporcion;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Comprimido = canvas.toDataURL('image/jpeg', 0.45);
            
            fotosActuales.push(base64Comprimido);
            renderizarCarrusel();
            apagarCamara();
        }

        function renderizarCarrusel() {
            const carrusel = document.getElementById('carrusel-fotos');
            if(fotosActuales.length === 0) {
                carrusel.classList.add('hidden');
                document.getElementById('foto-base64').value = "";
                return;
            }
            
            carrusel.classList.remove('hidden');
            carrusel.classList.add('flex');
            carrusel.innerHTML = "";
            
            fotosActuales.forEach((foto, i) => {
                carrusel.innerHTML += `
                    <div class="relative min-w-full flex-shrink-0 snap-center flex justify-center">
                        <img src="${foto}" onclick="abrirModalImagen(this.src)" class="h-48 rounded-lg object-contain shadow-md border border-zinc-700 cursor-pointer">
                        <button type="button" onclick="eliminarFoto(${i})" class="absolute top-1 right-2 bg-red-600/90 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold shadow-md hover:bg-red-500 transition-colors">X</button>
                    </div>
                `;
            });
            document.getElementById('foto-base64').value = JSON.stringify(fotosActuales);
        }

        function eliminarFoto(index) {
            fotosActuales.splice(index, 1);
            renderizarCarrusel();

        async function guardarDatos(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btn-guardar-datos');
            const originalBtnText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = "⌛ Procesando...";
            btnSubmit.disabled = true;

            const codigoIngresado = prompt("🔒 Ingrese el código de seguridad (1234b):");
            if (codigoIngresado !== "1234b") {
                alert("❌ Código incorrecto."); 
                btnSubmit.innerHTML = originalBtnText;
                btnSubmit.disabled = false;
                return;
            }
            
            const nombreInput = document.getElementById('nombre-cliente').value.trim();

            if (!filaEditando) {
                document.getElementById('form-titulo').innerText = "⌛ Verificando...";
                try {
                    let res = await fetch(`${WEB_APP_URL}?action=get`);
                    resultadosGlobales = await res.json();
                } catch(err) {}
                
                const generoSeleccionado = document.getElementById('form-genero').value;
                const prendaSeleccionada = document.getElementById('form-prenda').value;
                document.getElementById('form-titulo').innerText = `📝 ${prendaSeleccionada.toUpperCase()} (${generoSeleccionado.toUpperCase()})`;

                const nombreBuscado = normalizarTexto(nombreInput);
                const existe = resultadosGlobales.find(c => c.nombre && normalizarTexto(c.nombre) === nombreBuscado);
                
                if (existe) {
                    const irAlPerfil = confirm(`⚠️ EL CLIENTE YA ESTÁ REGISTRADO: "${existe.nombre}"\n\n¿Deseas ir a los usuarios registrados para crearle un nuevo pedido reciclando sus medidas?\n\n(Aceptar = Ir al perfil | Cancelar = Ignorar advertencia y registrar)`);
                    if (irAlPerfil) {
                        cambiarSeccion('sec-buscar');
                        document.getElementById('input-buscar').value = existe.nombre;
                        buscarCliente();
                        btnSubmit.innerHTML = originalBtnText;
                        btnSubmit.disabled = false;
                        return;
                    }
                }
            }

            const genero = document.getElementById('form-genero').value;
            const prenda = document.getElementById('form-prenda').value;
            const identificadorActual = `${genero}-${prenda}`;

            let datos = {
                action: filaEditando ? "edit" : "add",
                fecha: new Date().toLocaleDateString(),
                fecha_entrega: document.getElementById('fecha-entrega').value,
                hora_entrega: document.getElementById('hora-entrega').value,
                acuenta: document.getElementById('pago-acuenta').value,
                saldo: document.getElementById('pago-saldo').value,
                total: document.getElementById('pago-total').value,
                genero: genero,
                prenda: prenda,
                nombre: nombreInput
            };
            
            let mostroMensajeReinicio = false;
            if (filaEditando) {
                datos.fila = filaEditando;
                
                const reiniciar = confirm("Estás guardando cambios en un cliente existente.\n\n¿Deseas reiniciar los botones de proceso (Comprado/Cortado/Entregar) para empezar un NUEVO PEDIDO desde cero?\n\n• ACEPTAR = Sí, reiniciar los botones.\n• CANCELAR = No, solo estoy corrigiendo un dato.");
                
                if (reiniciar) {
                    datos.estado = 'Pendiente';
                    datos.anotacion_proceso = ' '; // Espacio en blanco fuerza el reseteo en la base de datos
                    mostroMensajeReinicio = true;
                } else {
                    const clienteViejo = resultadosGlobales.find(c => c.fila === filaEditando);
                    if(clienteViejo) {
                        datos.estado = clienteViejo.estado;
                        datos.anotacion_proceso = clienteViejo.anotacion_proceso;
                    }
                }
            }

            const camposParaEstaPrenda = camposPersonalizados.filter(c => c.destino === 'Todos' || c.destino === identificadorActual);
            camposParaEstaPrenda.forEach(campo => {
                if (campo.tipo !== 'separator') {
                    const inputElement = document.getElementById(campo.id);
                    if(inputElement) datos[campo.nombre] = inputElement.value;
                }
            });

            const fotoData = document.getElementById('foto-base64').value;
            if(fotoData !== "") datos['foto_referencia'] = fotoData;

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });
                
                if (mostroMensajeReinicio) {
                    alert("✅ ¡Datos guardados exitosamente!\n\nSe han reiniciado los botones de proceso para este nuevo pedido.");
                } else {
                    alert(filaEditando ? "✅ ¡Corrección guardada correctamente!" : "✅ ¡Datos guardados en Google Sheets!");
                }
                
                cargarClientesSilencioso();
                btnSubmit.innerHTML = originalBtnText;
                btnSubmit.disabled = false;
                regresarMenu();
            } catch (error) {
                alert("Error de conexión al guardar.");
                btnSubmit.innerHTML = originalBtnText;
                btnSubmit.disabled = false;
            }
        }

                }
                if (isCortado) {
                    detalleProceso += `<div class="mt-3 text-xs text-indigo-400 font-bold bg-indigo-900/20 p-2 rounded-lg border border-indigo-500/30">📌 Anotación: La tela para esta prenda ya fue CORTADA.</div>`;
                }

                let btnCompradoClass = isComprado
                    ? "flex-1 bg-transparent border-2 border-purple-500 text-purple-400 font-bold py-2 rounded-xl shadow-none text-xs cursor-default transition-all"
                    : "flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl shadow-md text-xs transition-all cursor-pointer";

                let btnCortadoClass = isCortado
                    ? "flex-1 bg-transparent border-2 border-indigo-500 text-indigo-400 font-bold py-2 rounded-xl shadow-none text-xs cursor-default transition-all"
                    : "flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl shadow-md text-xs transition-all cursor-pointer";

                let onclickComprado = isComprado ? "" : `onclick="cambiarEstado(${c.fila}, 'Comprado', event)"`;
                let onclickCortado = isCortado ? "" : `onclick="cambiarEstado(${c.fila}, 'Cortado', event)"`;

                let subEstados = esEntregado ? '' : `
                    <div class="mt-2 flex gap-2 w-full items-center justify-center" id="subestados-${c.fila}">
                        <button id="btn-comprado-${c.fila}" ${onclickComprado} class="${btnCompradoClass}">🛍️ COMPRADO</button>
                        <button id="btn-cortado-${c.fila}" ${onclickCortado} class="${btnCortadoClass}">✂️ CORTADO</button>
                    </div>
                `;

                contenedor.innerHTML += `
                    <div class="p-4 bg-zinc-800 rounded-xl border-l-4 ${bordeTarjeta} space-y-2 shadow-md transition-all" id="tarjeta-${c.fila}">
                        <div class="flex justify-between items-start">
                            <div class="pr-2">
                                <strong class="text-white text-lg">${c.nombre}</strong> 
                                <span class="text-sm text-amber-500 font-bold ml-1">(${c.genero} - ${c.prenda})</span>
                            </div>
                            ${estadoBadge}
                        </div>
                        <p class="text-xs text-gray-500 mb-1">Registro: ${formatearFechaTexto(c.fecha)}</p>
                        ${textoFechaEntrega}
                        
                        ${finanzasHTML}

                        <div class="mt-3 leading-relaxed bg-zinc-900 p-4 rounded-lg border border-zinc-700 relative">
                            ${detallesHTML} 
                            ${imagenHTML}
                            <div id="detalle-proceso-${c.fila}">${detalleProceso}</div>
                        </div>
                        
                        <div class="mt-4 flex justify-between items-center border-t border-zinc-700 pt-4" id="acciones-${c.fila}">
                            ${estadoTexto}
                            <button onclick="editarCliente(${c.fila})" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-xl shadow-md transition-all text-center ml-2">✏️ Editar</button>
                        </div>
                        ${subEstados}
                    </div>
                `;
            });
        }

        async function buscarCliente() {
            const query = normalizarTexto(document.getElementById('input-buscar').value);
            const contenedor = document.getElementById('resultados-busqueda');
            if (!query) return;
            
            contenedor.innerHTML = "<p class='text-amber-500 text-lg animate-pulse text-center'>Buscando en todos los registros...</p>";

            try {
                let res = await fetch(`${WEB_APP_URL}?action=get`);
                let lista = await res.json();
                resultadosGlobales = lista; 
                
                let resultados = lista.filter(item => {
                    for (let key in item) {
                        if (key === 'foto_referencia' || key === 'action') continue; 
                        if (item[key] && normalizarTexto(item[key].toString()).includes(query)) {
                            return true;
                        }
                    }
                    return false;
                });
                
                renderizarListaClientes(resultados, contenedor);
            } catch (error) {
                contenedor.innerHTML = "<p class='text-red-500 text-lg text-center'>Error al consultar Google Sheets.</p>";
            }
        }

        async function mostrarTodos() {
            cambiarSeccion('sec-buscar');
            document.getElementById('input-buscar').value = ''; 
            const contenedor = document.getElementById('resultados-busqueda');
            contenedor.innerHTML = "<p class='text-amber-500 text-lg animate-pulse text-center'>Cargando todos los registros...</p>";

            try {
                let res = await fetch(`${WEB_APP_URL}?action=get`);
                let lista = await res.json();
                resultadosGlobales = lista; 
                let resultados = lista.filter(item => item.nombre && item.nombre.trim() !== "");
                renderizarListaClientes(resultados, contenedor);
            } catch (error) {
                contenedor.innerHTML = "<p class='text-red-500 text-lg text-center'>Error al consultar Google Sheets.</p>";
            }
        }

        async function mostrarPendientes() {
            cambiarSeccion('sec-buscar');
            document.getElementById('input-buscar').value = ''; 
            const contenedor = document.getElementById('resultados-busqueda');
            contenedor.innerHTML = "<p class='text-green-500 text-lg animate-pulse text-center'>Cargando trabajos pendientes...</p>";

            try {
                let res = await fetch(`${WEB_APP_URL}?action=get`);
                let lista = await res.json();
                resultadosGlobales = lista; 
                let resultados = lista.filter(item => item.nombre && item.nombre.trim() !== "" && item.estado !== 'Entregado');
                renderizarListaClientes(resultados, contenedor);
            } catch (error) {
                contenedor.innerHTML = "<p class='text-red-500 text-lg text-center'>Error al consultar Google Sheets.</p>";
            }
        }

        async function cambiarEstado(fila, nuevoEstado, event) {
            if (nuevoEstado === 'Entregado') {
                if(!confirm("¿Seguro que deseas marcar esta prenda como Entregada?")) return;
            }
            
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = "⌛...";
            btn.disabled = true;

            const clienteActual = resultadosGlobales.find(c => c.fila === fila) || {};
            let anotacionActual = (clienteActual.anotacion_proceso || '').trim();
            let estadoActual = clienteActual.estado || 'Pendiente';

            try {
                let payload = { action: "edit", fila: fila };
                
                if (nuevoEstado === 'Comprado' || nuevoEstado === 'Cortado') {
                    if (!anotacionActual.includes(nuevoEstado)) {
                        anotacionActual = anotacionActual ? anotacionActual + ',' + nuevoEstado : nuevoEstado;
                    }
                    payload.anotacion_proceso = anotacionActual;
                    clienteActual.anotacion_proceso = anotacionActual;
                    
                    payload.estado = estadoActual !== 'Entregado' ? nuevoEstado : 'Entregado';
                    clienteActual.estado = payload.estado;
                } else if (nuevoEstado === 'Entregado') {
                    payload.estado = 'Entregado';
                    clienteActual.estado = 'Entregado';
                }

                await fetch(WEB_APP_URL, {
                    method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                // ACTUALIZACIÓN VISUAL INSTANTÁNEA
                let isComprado = anotacionActual.includes('Comprado');
                let isCortado = anotacionActual.includes('Cortado');

                if (nuevoEstado === 'Comprado' || nuevoEstado === 'Cortado') {
                    const btnComprado = document.getElementById(`btn-comprado-${fila}`);
                    const btnCortado = document.getElementById(`btn-cortado-${fila}`);
                    
                    if (nuevoEstado === 'Comprado' && btnComprado) {
                        btnComprado.className = "flex-1 bg-transparent border-2 border-purple-500 text-purple-400 font-bold py-2 rounded-xl shadow-none text-xs cursor-default transition-all";
                        btnComprado.onclick = null; 
                        btnComprado.innerHTML = "🛍️ COMPRADO";
                    }
                    if (nuevoEstado === 'Cortado' && btnCortado) {
                        btnCortado.className = "flex-1 bg-transparent border-2 border-indigo-500 text-indigo-400 font-bold py-2 rounded-xl shadow-none text-xs cursor-default transition-all";
                        btnCortado.onclick = null;
                        btnCortado.innerHTML = "✂️ CORTADO";
                    }

                    const badge = document.getElementById(`badge-estado-${fila}`);
                    if (badge && estadoActual !== 'Entregado') {
                        badge.innerText = nuevoEstado;
                        let colorBadge = nuevoEstado === 'Comprado' ? "bg-purple-600/30 text-purple-400" : "bg-indigo-600/30 text-indigo-400";
                        badge.className = `px-2 py-1 text-[10px] rounded uppercase font-bold tracking-widest ${colorBadge}`;
                    }

                    const divDetalle = document.getElementById(`detalle-proceso-${fila}`);
                    if (divDetalle) {
                        let html = '';
                        if (isComprado) html += `<div class="mt-3 text-xs text-purple-400 font-bold bg-purple-900/20 p-2 rounded-lg border border-purple-500/30">📌 Anotación: El material para esta prenda ya fue COMPRADO.</div>`;
                        if (isCortado) html += `<div class="mt-3 text-xs text-indigo-400 font-bold bg-indigo-900/20 p-2 rounded-lg border border-indigo-500/30">📌 Anotación: La tela para esta prenda ya fue CORTADA.</div>`;
                        divDetalle.innerHTML = html;
                    }
                } else if (nuevoEstado === 'Entregado') {
                    const tarjeta = document.getElementById(`tarjeta-${fila}`);
                    if (tarjeta) {
                        tarjeta.classList.remove('border-amber-500');
                        tarjeta.classList.add('border-red-500');
                    }
                    const btnEntregar = document.getElementById(`btn-entregar-${fila}`);
                    if (btnEntregar) {
                        btnEntregar.outerHTML = `<span class="text-red-500 font-extrabold text-lg tracking-wider w-full text-center" id="txt-entregado-${fila}">ENTREGADO</span>`;
                    }
                    const subestados = document.getElementById(`subestados-${fila}`);
                    if (subestados) subestados.remove(); 
                    
                    const badge = document.getElementById(`badge-estado-${fila}`);
                    if (badge) {
                        badge.innerText = "ENTREGADO";
                        badge.className = `px-2 py-1 text-[10px] rounded uppercase font-bold tracking-widest bg-red-500/20 text-red-500`;
                    }
                }
            } catch (error) {
                alert("Error al actualizar estado.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function editarCliente(fila) {
            const cliente = resultadosGlobales.find(c => c.fila === fila);
            if(!cliente) return;

            abrirFormulario(cliente.genero, cliente.prenda);
            filaEditando = fila; 
            
            setTimeout(() => {
                document.getElementById('form-titulo').innerText = `✏️ EDITANDO: ${cliente.nombre.toUpperCase()}`;
                document.getElementById('nombre-cliente').value = cliente.nombre;
                
                if(cliente.fecha_entrega) document.getElementById('fecha-entrega').value = cliente.fecha_entrega;
                if(cliente.hora_entrega) document.getElementById('hora-entrega').value = cliente.hora_entrega;
                if(cliente.acuenta) document.getElementById('pago-acuenta').value = cliente.acuenta;
                if(cliente.saldo) document.getElementById('pago-saldo').value = cliente.saldo;
                if(cliente.total) document.getElementById('pago-total').value = cliente.total;
                
                if(cliente.foto_referencia && cliente.foto_referencia.trim() !== "") {
                    if (cliente.foto_referencia.startsWith('[')) {
                        try {
                            fotosActuales = JSON.parse(cliente.foto_referencia);
                            renderizarCarrusel();
                        } catch(e) {}
                    } else if (cliente.foto_referencia.startsWith('data:image')) {
                        fotosActuales = [cliente.foto_referencia];
                        renderizarCarrusel();
                    }
                }

                camposPersonalizados.forEach(campo => {
                    if (campo.tipo !== 'separator') {
                        const inputElement = document.getElementById(campo.id);
                        if(inputElement && cliente[campo.nombre]) {
                            inputElement.value = cliente[campo.nombre];
                        }
                    }
                });
            }, 100);
        }

        const manifest = {
            name: "Sastrería App", short_name: "Sastrería",
            start_url: window.location.href, display: "standalone",
            background_color: "#080808", theme_color: "#d97706",
            icons: [{ src: iconoBase64, sizes: "192x192", type: "image/svg+xml" }, { src: iconoBase64, sizes: "512x512", type: "image/svg+xml" }]
        };
        const blobManifest = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blobManifest);
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);

        let eventoInstalacion = null;
        const btnInstalar = document.getElementById('btn-instalar');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); eventoInstalacion = e;
            btnInstalar.classList.remove('hidden');
        });

        btnInstalar.addEventListener('click', async () => {
            if (!eventoInstalacion) return;
            eventoInstalacion.prompt();
            const { outcome } = await eventoInstalacion.userChoice;
            if (outcome === 'accepted') btnInstalar.classList.add('hidden');
            eventoInstalacion = null;
        });

        window.addEventListener('appinstalled', () => { btnInstalar.classList.add('hidden'); });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
